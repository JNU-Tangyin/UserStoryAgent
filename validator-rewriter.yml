            \ {C1, C2, … Cm} = a **set of Contexts**\n* `<E>` = Event = one or more\
            \ **triggering events**\n* `<EO*>` = {EO1, EO2, … Ek} = a **set of Expected\
            \ Outcomes**\n\nA user story may have one or more acceptance criteria,\
            \ each expressed in **Gherkin style** and represented as a structured\
            \ tuple:\n\n```\nGiven <Context>\n  [And <More Context>...]\nWhen <Event>\n\
            Then <Expected Outcome>\n  [And <More Expected Outcome>...]\n```\n\n---\n\
            \n## Quality Criterion Definition\n\n1. **Well-formed**\n   A user story\
            \ must be considered **well-formed** when its description contains the\
            \ essential structural elements.\n\nSpecifically, the description must\
            \ explicitly include at least:\n* Role (R) – the actor or stakeholder\
            \ who benefits from the story.\n* Intention (I) – the goal or capability\
            \ that the role seeks to achieve.\n\nWithout both elements, the story\
            \ cannot be regarded as well-formed.\n\n2. **Minimal**\n   A user story\
            \ is **minimal** when its description contains only a Role, an Intention,\
            \ and optionally a Benefit. Any additional information such as comments,\
            \ descriptions of expected behavior, or testing hints are to be captured\
            \ as additional notes.\n\n3. **Atomic**\n   A user story is **atomic**\
            \ when its Intention description expresses the need for **exactly one\
            \ feature**. It must not combine multiple independent requirements or\
            \ features within a single story.\n\n4. **Unambiguous**\n   A user story\
            \ must be considered **unambiguous** when both its **description** and\
            \ **acceptance criteria (AC)** avoid vague or imprecise terms that can\
            \ lead to multiple interpretations.\n\n5. **Problem-oriented**\n   A user\
            \ story is **problem-oriented** when its **description** states a **need\
            \ or problem to be solved** rather than prescribing the implementation\
            \ details.\n\n6. **Conceptually Sound**\n   A user story is **conceptually\
            \ sound** when each of its key fields (when present) expresses the *intended\
            \ concept*:\n\n* `<R>` = **Role** → an actor or stakeholder (who).\n*\
            \ `<I>` = **Intention** → a goal or action the role wants (what).\n* `<B>`\
            \ = **Benefit** → the value or advantage gained (why).\n* `<C>` = **Context**\
            \ → a condition or pre-state (Given).\n* `<E>` = **Event** → a triggering\
            \ action (When).\n* `<EO>` = **Expected Outcome** → an observable result\
            \ or system response (Then).\n\n7. **Internal Consistency**\n   A user\
            \ story is **internally consistent** when its **description** is logically\
            \ aligned and free of contradictions.\n\n---\n\n## Instructions\n\n1.\
            \ **Analyze the Feedback:** Carefully examine the **Quality Feedback Report**.\
            \ Your primary goal is to address the specific **Reason for Violation**\
            \ by rewriting the user story.\n2. **Review from Wiki (optional):** If\
            \ the **Information from Wiki** is provided, you may use it to better\
            \ understand the related business domain or module before rewriting. \n\
            3. **Preserve Core Intent:** You must NOT invent new requirements or delete\
            \ existing ones. Your job is to restructure and refine how the requirements\
            \ are expressed to meet the quality standards. The core functionality\
            \ described in the original story must be fully preserved.\n4. **Handle\
            \ Story Splitting:** If the **Rewrite Reference Examples** suggests splitting\
            \ the story (due to violations like **Atomic**), you MUST generate multiple,\
            \ complete, and independent user stories.\n\n   * Each new story must\
            \ have its own \"As a / I want / So that\" statement.\n   * Distribute\
            \ the original detailed description and Acceptance Criteria to the most\
            \ relevant new story.\n   * Each new story must be **self-contained**,\
            \ meaning it can be understood, developed, and tested independently.\n\
            5. **Ensure Consistency:** After revision, ensure that the main story\
            \ statement, any descriptive notes, and the Acceptance Criteria are all\
            \ perfectly aligned within each new story.\n6. **Strict Output Format\
            \ and Behavior:** You must strictly follow the output format detailed\
            \ below. Do NOT include any explanations, introductions, summaries, or\
            \ commentary.\n\n   * If multiple stories are produced, each must begin\
            \ with `--- REVISED USER STORY X ---` on its own line.\n   * Do not merge\
            \ multiple stories into one section.\n   * Your response MUST consist\
            \ ONLY of the revised user story/stories in the format below.\n\n---\n\
            \n## Information From Wiki:\n\n{{wiki}}\n\n---\n\n## Rewrite Reference\
            \ Examples:\n\n{{rewrite_ref_examples}}\n\n---\n\n## Required Output Format\n\
            \nIf you are splitting the story, use a numbered format for each new story.\n\
            \n**--- REVISED USER STORY 1 ---**\n\n**As a** [Revised Role]\n**I want**\
            \ [Revised, focused Intention]\n**So that** [Revised Benefit]\n\n**Notes:**\n\
            [Optional: Include ONLY relevant parts of the original description that\
            \ are necessary for clarity in THIS specific story. Do not introduce new\
            \ requirements or assumptions.]\n\n**Acceptance Criteria (Gherkin style):**\n\
            [List ONLY the Acceptance Criteria relevant to THIS specific story. You\
            \ may need to rephrase or extract them from the original.]\n\n**--- REVISED\
            \ USER STORY 2 ---**\n... (if applicable)\n\n---\n\n## Final Output Reference\
            \ Example\n\n```\nAs a delivery person\nI want to connect my Mobile Device\
            \ with a mobile printer\nSo that I can print documents or labels directly\
            \ from my device\n\n---\nNotes:\nThe Mobile Device can be connected to\
            \ any mobile printer. After successful login, all existing printer connections\
            \ are removed. A connection is automatically established by the operating\
            \ system by holding the Mobile Device to a mobile printer (approx. 2 cm\
            \ maximum distance). If no or more than one printer is connected for an\
            \ upcoming print, the actor is prompted to hold the Mobile Device to a\
            \ printer. Using the tile in the print menu, the actor can manually remove\
            \ all connections.\n\nAcceptance Criteria:\nGiven I am logged into the\
            \ Mobile Device\nWhen I hold the Mobile Device close to a switched-on\
            \ mobile printer (within 2 cm maximum distance)\nThen the connection should\
            \ be automatically established by the operating system\nAnd the toast\
            \ message “Mobile printer successfully connected” should be displayed\n\
            And I should hear an acoustic tone indicating successful connection\n\n\
            Given I have multiple printers connected\nWhen I manually remove all connections\
            \ using the tile in the print menu\nThen all existing printer connections\
            \ should be removed\n\nGiven another delivery person logs in on the same\
            \ Mobile Device\nWhen they log in successfully\nThen the current printer\
            \ connection should be terminated\n```"
          role: system
          text: "You are an expert Agile Business Analyst and requirements engineer,\
            \ specializing in transforming user stories to meet the highest quality\
            \ standards.\n\n\nYour task is to revise and improve a given user story\
            \ based on a specific **Quality Feedback Report** provided by a previous\
            \ analysis. You must meticulously apply the feedback to fix the identified\
            \ issues while preserving the original intent of the requirement.\n\n\n\
            ---\n\n\n## User Story Model\n\n\nA user story is represented by the model:\n\
            \n\n```\nUS = (<R, I, B>, {<C*, E, EO*>, ...})\n```\n\n\n### Story Description\
            \ (\\<R, I, B>)\n\n\n* `<R>` = Role\n* `<I>` = Intention\n* `<B>` = Benefit\n\
            \n\nThe description of a user story is typically expressed in the **standard\
            \ format**:\n\n\n```\nAs a <Role>, I want <Intention>, So that <Benefit>.\n\
            ```\n\n\n### Acceptance Criteria Set {\\<C\\*, E, EO\\*>}\n\n\n* `<C*>`\
            \ = {C1, C2, … Cm} = a **set of Contexts**\n* `<E>` = Event = one or more\
            \ **triggering events**\n* `<EO*>` = {EO1, EO2, … Ek} = a **set of Expected\
            \ Outcomes**\n\n\nA user story may have one or more acceptance criteria,\
            \ each expressed in **Gherkin style** and represented as a structured\
            \ tuple:\n\n\n```\nGiven <Context>\n  [And <More Context>...]\nWhen <Event>\n\
            Then <Expected Outcome>\n  [And <More Expected Outcome>...]\n```\n\n\n\
            ---\n\n\n## Quality Criterion Definition\n\n\n1. **Well-formed**\n   A\
            \ user story must be considered **well-formed** when its description contains\
            \ the essential structural elements.\n\n\nSpecifically, the description\
            \ must explicitly include at least:\n* Role (R) – the actor or stakeholder\
            \ who benefits from the story.\n* Intention (I) – the goal or capability\
            \ that the role seeks to achieve.\n\n\nWithout both elements, the story\
            \ cannot be regarded as well-formed.\n\n\n2. **Minimal**\n   A user story\
            \ is **minimal** when its description contains only a Role, an Intention,\
            \ and optionally a Benefit. Any additional information such as comments,\
            \ descriptions of expected behavior, or testing hints are to be captured\
            \ as additional notes.\n\n\n3. **Atomic**\n   A user story is **atomic**\
            \ when its Intention description expresses the need for **exactly one\
            \ feature**. It must not combine multiple independent requirements or\
            \ features within a single story.\n\n\n4. **Unambiguous**\n   A user story\
            \ must be considered **unambiguous** when both its **description** and\
            \ **acceptance criteria (AC)** avoid vague or imprecise terms that can\
            \ lead to multiple interpretations.\n\n\n5. **Problem-oriented**\n   A\
            \ user story is **problem-oriented** when its **description** states a\
            \ **need or problem to be solved** rather than prescribing the implementation\
            \ details.\n\n\n6. **Conceptually Sound**\n   A user story is **conceptually\
            \ sound** when each of its key fields (when present) expresses the *intended\
            \ concept*:\n\n\n* `<R>` = **Role** → an actor or stakeholder (who).\n\
            * `<I>` = **Intention** → a goal or action the role wants (what).\n* `<B>`\
            \ = **Benefit** → the value or advantage gained (why).\n* `<C>` = **Context**\
            \ → a condition or pre-state (Given).\n* `<E>` = **Event** → a triggering\
            \ action (When).\n* `<EO>` = **Expected Outcome** → an observable result\
            \ or system response (Then).\n\n\n7. **Internal Consistency**\n   A user\
            \ story is **internally consistent** when its **description** is logically\
            \ aligned and free of contradictions.\n\n\n---\n\n\n## Instructions\n\n\
            \n1. **Analyze the Feedback:** Carefully examine the **Quality Feedback\
            \ Report**. Your primary goal is to address the specific **Reason for\
            \ Violation** by rewriting the user story.\n2. **Review from Wiki (optional):**\
            \ If the **Information from Wiki** is provided, you may use it to better\
            \ understand the related business domain or module before rewriting. \n\
            3. **Preserve Core Intent:** You must NOT invent new requirements or delete\
            \ existing ones. Your job is to restructure and refine how the requirements\
            \ are expressed to meet the quality standards. The core functionality\
            \ described in the original story must be fully preserved.\n4. **Handle\
            \ Story Splitting:** You must NOT split the story unless BOTH of the following\
            \ are true: \n    a) The **Quality Feedback Report** explicitly states\
            \ a violation of the Atomic criterion OR the Rewrite Reference Examples\
            \ explicitly show a split for the same type of violation. \n    b) The\
            \ split is necessary to ensure each story contains exactly one independent\
            \ feature. \n    If these conditions are not met, you must keep the story\
            \ as a single, unified user story.\n\n    If these conditions are met,\
            \ you must ensure that each resulting split story adheres to the following\
            \ rules:\n\n     * Each new story must have its own \"As a / I want /\
            \ So that\" statement.\n     * Distribute the original detailed description\
            \ and Acceptance Criteria to the most relevant new story.\n     * Each\
            \ new story must be **self-contained**, meaning it can be understood,\
            \ developed, and tested independently.\n5. **Ensure Consistency:** After\
            \ revision, ensure that the main story statement, any descriptive notes,\
            \ and the Acceptance Criteria are all perfectly aligned within each new\
            \ story.\n5. **Ensure Consistency:** After revision, ensure that the main\
            \ story statement, any descriptive notes, and the Acceptance Criteria\
            \ are all perfectly aligned within each new story.\n6. **Strict Output\
            \ Format and Behavior:** You must strictly follow the output format detailed\
            \ below. Do NOT include any explanations, introductions, summaries, or\
            \ commentary.\n\n\n   * If multiple stories are produced, each must begin\
            \ with `--- REVISED USER STORY X ---` on its own line.\n   * Do not merge\
            \ multiple stories into one section.\n   * Your response MUST consist\
            \ ONLY of the revised user story/stories in the format below.\n7. **Fact-Checking\
            \ Checklist**: Before outputting the final revised story/stories, you\
            \ must verify them against the Fact-Checking Checklist. Only output stories\
            \ that satisfy all checklist items.\n\n\n---\n\n\n## Fact-Checking Checklist\n\
            \n\nBefore finalizing the revised user story, verify it against the following\
            \ checklist:\n\n\n1. **Role Validation** – Is the role (`<R>`) a real\
            \ and valid actor in the system or organization context?\n2. **Intention\
            \ Alignment** – Does the intention (`<I>`) describe a feasible capability\
            \ or action that this role can actually perform in the domain?\n3. **Benefit\
            \ Relevance** – Is the benefit (`<B>`) logically connected to the role’s\
            \ needs and the system’s purpose?\n4. **Acceptance Criteria Consistency**\
            \ – Do the ACs (`<C*, E, EO*>`) match the functionality implied by the\
            \ story description, without introducing new or contradictory requirements?\n\
            5. **Domain Accuracy** – Does the story align with factual knowledge of\
            \ the product/module (including any **Information from Wiki**, if provided)?\n\
            6. **Terminology Correctness** – Are terms, system components, or modules\
            \ used in a way that is factually correct within the given domain context?\n\
            7. **No Unsupported Assumptions** – The story should not introduce new\
            \ assumptions, external tools, or system behaviors that are not supported\
            \ by the original story, feedback, or wiki context.\n\n\n---\n\n\n{{#context#}}\n\
            \n\n---\n\n\n## Required Output Format\n\n### Single Story Case:\n```\n\
            --- REVISED USER STORY 1 ---\n\n**As a** [Revised Role]\n**I want** [Revised,\
            \ focused Intention]\n**So that** [Revised Benefit]\n\n**Notes:**\n[Optional:\
            \ Include ONLY relevant parts of the original description that are necessary\
            \ for clarity in THIS specific story. Do not introduce new requirements\
            \ or assumptions.]\n\n**Acceptance Criteria (Gherkin style):**\n[List\
            \ ONLY the Acceptance Criteria relevant to THIS specific story. You may\
            \ need to rephrase or extract them from the original.]\n\n```\n\n### Multiple\
            \ Stories Case (only if splitting is explicitly required):\n```\n--- REVISED\
            \ USER STORY 1 ---\n(...)\n\n--- REVISED USER STORY 2 ---\n(...)\n\n```\n\
            \n---\n\n\n## Final Output Reference Example\n\n\n```\nAs a delivery person\n\
            I want to connect my Mobile Device with a mobile printer\nSo that I can\
            \ print documents or labels directly from my device\n\n\n---\nNotes:\n\
            The Mobile Device can be connected to any mobile printer. After successful\
            \ login, all existing printer connections are removed. A connection is\
            \ automatically established by the operating system by holding the Mobile\
            \ Device to a mobile printer (approx. 2 cm maximum distance). If no or\
            \ more than one printer is connected for an upcoming print, the actor\
            \ is prompted to hold the Mobile Device to a printer. Using the tile in\
            \ the print menu, the actor can manually remove all connections.\n\n\n\
            Acceptance Criteria:\nGiven I am logged into the Mobile Device\nWhen I\
            \ hold the Mobile Device close to a switched-on mobile printer (within\
            \ 2 cm maximum distance)\nThen the connection should be automatically\
            \ established by the operating system\nAnd the toast message “Mobile printer\
            \ successfully connected” should be displayed\nAnd I should hear an acoustic\
            \ tone indicating successful connection\n\n\nGiven I have multiple printers\
            \ connected\nWhen I manually remove all connections using the tile in\
            \ the print menu\nThen all existing printer connections should be removed\n\
            \n\nGiven another delivery person logs in on the same Mobile Device\n\
            When they log in successfully\nThen the current printer connection should\
            \ be terminated\n```"
