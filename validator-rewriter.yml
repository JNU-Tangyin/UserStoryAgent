            * `<C>` = *user is logged in* → Context

            * `<E>` = *user clicks "Download Report"* → Event

            * `<EO>` = *system generates a PDF with today''s data* → Expected Outcome


            ---


            Acceptance Criteria:

            ```

            Given the checklist has failures

            When the checklist is in failed state

            Then the system ensures quality

            ```

            → Violation


            * `<C>` = *checklist has failures* → Context

            * `<E>` = *checklist is in failed state* → this is a state, not a triggering
            Event

            * `<EO>` = *system ensures quality* → vague system intent, not an observable
            outcome


