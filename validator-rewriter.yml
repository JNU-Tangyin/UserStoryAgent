            ```

            Given a trigger is available  

            When the trigger occurs  

            Then local tasks run or the system reacts appropriately

            ```


            Violation: The intention is ambiguous: does the story require user-triggered
            local tasks, reactions to external events, or both? The AC''s  "or" and
