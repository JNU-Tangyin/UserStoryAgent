            ## Quality Criteria


            ### Unambiguous


            A user story must be considered **unambiguous** when both its **description**
            and **acceptance criteria (AC)** avoid vague or imprecise terms that can
            lead to multiple interpretations.


            ## Examples


            Story:

            As a quality inspector, I want to mark failed tests, so that I can queue
            them for immediate review.


            Acceptance Criteria:

            ```

            Given the test run is completed  

            When the inspector clicks "Mark Failed" on a test result  

            Then the test is added to the Review queue with a timestamp and inspector
            name

            ```


            Non-violation: All terms are specific and testable. The action and expected
            result are concrete (queue with timestamp), so there is no vague wording.


            ---


            Story:

            As a report author, I want the form to prevent submission when date fields
            are empty, so that reports always include required date values.


            Acceptance Criteria:

            ```

            Given the report form is open  

            When the user submits the form with any required date field blank  

            Then the form blocks submission and displays a validation message listing
            missing date fields

            ```


            Non-violation: The story and AC avoid subjective phrases. "Prevent submission"
            and "list missing date fields" are precise and unambiguous.


            ---


            Story:

            As an administrator, I want column widths to be adjustable in the audit
            log view, so that long messages are fully visible.


            Acceptance Criteria:

            ```

            Given the audit log page is displayed  

            When the admin drags a column edge to resize it  

            Then log messages in that column show full text up to 512 characters without
            truncation

            ```


            Non-violation: AC specifies a measurable outcome (up to 512 characters),
            removing ambiguity about "fully visible".


            ---


            Story:

            As a support agent, I want a searchable dropdown for error codes, so that
            I can locate the correct code by typing part of its name.


            Acceptance Criteria:

            ```

            Given the error-code dropdown is open  

            When the agent types a query of three or more characters  

            Then the list filters to codes whose name or description contains the
            query

            ```


            Non-violation: The intent and AC define precise behavior (three or more
            characters, matching name/description), so "searchable" is clarified and
            not vague.


            ---


            Story:

            As a field technician, I want to see current and historical device status,
            so that I can decide follow-up actions.


            Acceptance Criteria:

            ```

            Given device telemetry is available  

            When the technician views the device page  

            Then the UI shows the latest status and a timestamped history of the last
            7 days

            ```


            Non-violation: "Current and historical" is given a clear, measurable meaning
            (last 7 days), so ambiguity is eliminated.


            ---


