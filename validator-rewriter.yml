            grows with each request.

            → Violation


            * `<R>` = *monitoring service* → not a human/stakeholder role

            * `<I>` = *store API logs* → implementation/system action rather than
            a user goal

            * `<B>` = *database grows* → describes system behavior, not a user benefit


