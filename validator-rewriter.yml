            As a product owner, I want to add some kind of notice to AI-generated
            content, so that viewers treat results with care.


            Acceptance Criteria:

            ```

            Given AI content is displayed  

            When content is produced  

            Then show a notice of some kind

            ```


            Violation: Phrases "some kind of notice" and "treat results with care"
            are vague. The AC does not specify the notice type, location, or exact
            message, so it is ambiguous.


